<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08080f" />
    <meta name="description" content="AI Post Studio - AIニュース収集＆投稿生成" />
    <title>AI Post Studio</title>
    <style>
      :root {
        --aps-text-main: #d8e2f0;
        --aps-text-sub: #a9b6c8;
        --aps-text-muted: #7f8da3;
        --aps-accent: #7eb8f7;
      }

      .label {
        color: #6f7da0 !important;
      }

      .card,
      .card * {
        color: var(--aps-text-main) !important;
      }

      .card p,
      .card div {
        color: var(--aps-text-sub) !important;
      }

      .card strong {
        color: #eef5ff !important;
      }

      .card[style*="border-color"] strong,
      .card[style*="border-color"] div:first-child {
        color: var(--aps-accent) !important;
      }

      .tag {
        color: var(--aps-text-sub) !important;
      }

      .tag.active {
        color: #cfe7ff !important;
      }

      button:disabled,
      button:disabled * {
        color: var(--aps-text-muted) !important;
      }

      a {
        color: var(--aps-accent) !important;
      }

      [data-source-url-inline="true"] {
        color: #9fd0ff !important;
        font-size: 11px !important;
        line-height: 1.6 !important;
        margin: 8px 0 0 !important;
        overflow-wrap: anywhere !important;
        word-break: break-word !important;
      }

      .aps-kazane-card {
        text-align: left !important;
        border-color: rgba(67, 217, 173, 0.6) !important;
        background: linear-gradient(135deg, rgba(8, 62, 55, 0.75), rgba(17, 17, 26, 0.96)) !important;
      }

      .aps-kazane-card.is-active {
        border-color: #43d9ad !important;
        box-shadow: 0 0 0 1px rgba(67, 217, 173, 0.22), 0 0 20px rgba(67, 217, 173, 0.12) !important;
      }

      html.aps-kazane-active [data-aps-persona-grid] > button:not(.aps-kazane-card) {
        border-color: #1c1c2e !important;
        box-shadow: none !important;
      }

      html.aps-kazane-active [data-aps-persona-grid] > button:not(.aps-kazane-card) div:nth-child(2) {
        color: #d8e2f0 !important;
      }

      @media (max-width: 760px) {
        main {
          display: grid !important;
          grid-template-columns: 1fr !important;
          gap: 20px !important;
          padding: 16px !important;
        }

        main > aside {
          width: 100% !important;
          order: 2 !important;
        }

        main > section {
          min-width: 0 !important;
          order: 1 !important;
        }

        header > div {
          flex-wrap: wrap !important;
          gap: 12px !important;
        }

        [data-aps-persona-grid] {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }

        .card {
          min-width: 0 !important;
        }
      }

      @media (max-width: 480px) {
        [data-aps-persona-grid] {
          grid-template-columns: 1fr !important;
        }
      }
    </style>
    <script>
      (() => {
        const KAZANE_PROMPT = `あなたはPONORI合同会社の広報担当エージェント「カザネ」です。新しいAI技術や創作の兆しを風のように読み取り、PONORIの事業視点でやさしく伝えます。
【役割】
- PONORIのAIアニメーション制作・生成AI活用支援・IP開発に関係する視点でコメントする
- 単なるニュース要約ではなく、制作現場・クリエイター・小さなスタジオにとっての意味を添える
- 誇大広告や煽りは避け、実務に使える気づきを短く伝える
- PONORIの宣伝色を強くしすぎず、自然に「現場目線」「創作目線」を出す
【口調】
- 落ち着いた、知的で親しみやすい広報担当
- やわらかいが、意見ははっきり言う
- 「これは制作現場にも効いてきそうです」「小さなスタジオほど注目したい動きです」など、現場への接続を意識する
【投稿の構成】
1. ニュースの要点を一文で受ける
2. PONORI・AIアニメ・制作現場の視点で意味を添える
3. 必要なら読者に問いかける
【投稿スタイル】
- 140文字以内
- ハッシュタグは1〜2個まで
- 絵文字は使っても1つまで
- 元記事URLは本文に含めない。URLはアプリ側で別途付与される`;

        function enhanceQueueCards() {
          document.querySelectorAll("aside .card").forEach((card) => {
            const sourceLink = card.querySelector('a[href^="http"]');
            const body = card.querySelector("p");
            if (!sourceLink || !body || card.querySelector('[data-source-url-inline="true"]')) return;

            const source = document.createElement("div");
            source.setAttribute("data-source-url-inline", "true");
            source.textContent = `元ソース: ${sourceLink.href}`;
            body.insertAdjacentElement("afterend", source);
          });
        }

        function findPersonaGrid() {
          const labels = Array.from(document.querySelectorAll(".label"));
          const personaLabel = labels.find((node) => node.textContent?.includes("人格を選択"));
          const grid = personaLabel?.nextElementSibling;
          if (!grid || !grid.querySelector("button.card")) return null;
          grid.setAttribute("data-aps-persona-grid", "true");
          return grid;
        }

        function setNativeTextareaValue(textarea, value) {
          const setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value")?.set;
          if (setter) setter.call(textarea, value);
          else textarea.value = value;
          textarea.dispatchEvent(new Event("input", { bubbles: true }));
          textarea.dispatchEvent(new Event("change", { bubbles: true }));
        }

        function findPromptToggleButton() {
          return Array.from(document.querySelectorAll("button")).find((button) => {
            const text = button.textContent || "";
            return text.includes("プロンプト") || text.includes("閉じる");
          });
        }

        function updateGenerateButtonLabel() {
          const buttons = Array.from(document.querySelectorAll("button"));
          const generateButton = buttons.find((button) => {
            const text = button.textContent || "";
            return text.includes("として投稿を生成") || text.includes("生成中");
          });
          if (!generateButton) return;
          const text = generateButton.textContent || "";
          const next = text.includes("生成中") ? "🍃 カザネ 生成中…" : "🍃 カザネとして投稿を生成";
          if (generateButton.textContent !== next) generateButton.textContent = next;
        }

        function setKazaneActive(active) {
          document.documentElement.classList.toggle("aps-kazane-active", active);
          document.querySelectorAll(".aps-kazane-card").forEach((button) => button.classList.toggle("is-active", active));
          if (active) updateGenerateButtonLabel();
        }

        function applyKazanePrompt() {
          const promptButton = findPromptToggleButton();
          const wasPromptOpen = Array.from(document.querySelectorAll("textarea")).some((area) => area.value.includes("あなたは"));
          if (!wasPromptOpen && promptButton) promptButton.click();

          window.setTimeout(() => {
            const textarea = Array.from(document.querySelectorAll("textarea")).find((area) => area.value.includes("あなたは") || area.rows >= 5);
            if (!textarea) return;
            setNativeTextareaValue(textarea, KAZANE_PROMPT);
            setKazaneActive(true);
          }, 120);
        }

        function injectKazanePersona() {
          const grid = findPersonaGrid();
          if (!grid) return;

          grid.style.gridTemplateColumns = "repeat(3, minmax(0, 1fr))";
          grid.style.gap = "10px";

          Array.from(grid.querySelectorAll("button.card:not(.aps-kazane-card)")).forEach((button) => {
            if (button.dataset.apsDeactivateKazane === "true") return;
            button.dataset.apsDeactivateKazane = "true";
            button.addEventListener("click", () => setKazaneActive(false), true);
          });

          if (grid.querySelector(".aps-kazane-card")) return;

          const button = document.createElement("button");
          button.type = "button";
          button.className = "card aps-kazane-card";
          button.innerHTML = `
            <div style="font-size:18px">🍃</div>
            <div style="font-size:12px;font-weight:700;color:#9fd0ff">カザネ</div>
            <div style="font-size:10px;color:#8fa0b8">PONORI広報・制作現場目線</div>
          `;
          button.addEventListener("click", applyKazanePrompt);
          grid.appendChild(button);
        }

        function enhance() {
          enhanceQueueCards();
          injectKazanePersona();
          if (document.documentElement.classList.contains("aps-kazane-active")) updateGenerateButtonLabel();
        }

        window.addEventListener("load", () => {
          enhance();
          let scheduled = false;
          const observer = new MutationObserver(() => {
            if (scheduled) return;
            scheduled = true;
            window.setTimeout(() => {
              scheduled = false;
              enhance();
            }, 120);
          });
          observer.observe(document.body, { childList: true, subtree: true });
        });
      })();
    </script>
  </head>
  <body>
    <noscript>JavaScriptを有効にしてください。</noscript>
    <div id="root"></div>
  </body>
</html>
